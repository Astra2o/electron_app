<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Deep Backdrop Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glowing Blue/Purple Loop Gradient -->
    <linearGradient id="searchLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Sparkle/Stars Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Glassmorphic Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Intense Glow for Highlights -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="boost" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="240" cy="246" r="140" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.2" filter="url(#glow)" />

  <!-- The "Circle to Search" Hand-Drawn Style Loop -->
  <!-- Designed with a slight organic asymmetry, just like a finger gesture trace -->
  <path d="M 345,170 
           C 400,220 380,330 310,375 
           C 230,425 125,370 105,280 
           C 85,190 170,110 265,125
           C 320,133 365,175 375,220" 
        fill="none" 
        stroke="url(#searchLoopGrad)" 
        stroke-width="26" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Magic Shimmer Accent (Giving it that premium Samsung AI depth) -->
  <path d="M 345,170 
           C 400,220 380,330 310,375 
           C 230,425 125,370 105,280" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        opacity="0.6" />

  <!-- Futuristic Target Crosshairs / Corner Brackets -->
  <g stroke="#60a5fa" stroke-width="4" opacity="0.4" stroke-linecap="round">
    <!-- Top Left -->
    <path d="M 140,160 L 140,140 L 160,140" />
    <!-- Top Right -->
    <path d="M 340,140 L 360,140 L 360,160" />
    <!-- Bottom Left -->
    <path d="M 140,330 L 140,350 L 160,350" />
    <!-- Bottom Right -->
    <path d="M 360,330 L 360,350 L 340,350" />
  </g>

  <!-- Central Search Lens / Core -->
  <circle cx="240" cy="246" r="48" fill="url(#glassGrad)" stroke="url(#searchLoopGrad)" stroke-width="3" />
  <circle cx="240" cy="246" r="30" fill="#ffffff" opacity="0.05" />

  <!-- AI Sparkle 1 (Top Right Sparkle) -->
  <g transform="translate(360, 135) scale(0.9)" filter="url(#intenseGlow)">
    <path d="M 0,-30 C 0,-5 5,0 30,0 C 5,0 0,5 0,30 C 0,5 -5,0 -30,0 C -5,0 0,-5 0,-30 Z" fill="url(#sparkleGrad)" />
  </g>

  <!-- AI Sparkle 2 (Small Bottom Left Sparkle) -->
  <g transform="translate(115, 315) scale(0.55)" opacity="0.8">
    <path d="M 0,-30 C 0,-5 5,0 30,0 C 5,0 0,5 0,30 C 0,5 -5,0 -30,0 C -5,0 0,-5 0,-30 Z" fill="#93c5fd" />
  </g>

  <!-- Subtle Light Streak / Diagonal Reflection Overlay -->
  <path d="M 100,0 L 250,0 L 0,250 Z" fill="url(#glassGrad)" opacity="0.5" pointer-events="none" />
</svg>
